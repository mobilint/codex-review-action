# managed-by: mobilint/.github
# managed-template: code-review
# managed-template-version: 1
# Repository-specific policy belongs in the central reusable workflow or
# GitHub Actions variables, not in this caller file.

name: Codex Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
    types:
      - created

jobs:
  codex-review:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    # Keep this full commit SHA synchronized with the reviewed central caller.
    uses: mobilint/.github/.github/workflows/codex-pr-review.yml@69dfaece2995a6060a08df090ab27c9e78c0636f
